<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生注册 - 学生选课系统</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h1>学生注册</h1>
    <form th:action="@{/register}" th:object="${student}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>姓名
            <input type="text" th:field="*{name}">
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </label>
        <label>年龄
            <input type="number" th:field="*{age}">
            <span th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
        </label>
        <label>手机号
            <input type="text" th:field="*{phone}">
            <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </label>
        <label>入学时间
            <input type="date" th:field="*{enrollmentDate}">
            <span th:if="${#fields.hasErrors('enrollmentDate')}" th:errors="*{enrollmentDate}"></span>
        </label>
        <label>专业
            <select th:field="*{programId}">
                <option value="" disabled th:selected="${student.programId == null}">请选择专业</option>
                <option th:each="program : ${programs}" th:value="${program.id}" th:text="${program.name}"></option>
            </select>
            <span th:if="${#fields.hasErrors('programId')}" th:errors="*{programId}"></span>
        </label>
        <button type="submit">提交注册</button>
    </form>
    <p>已有账号？<a th:href="@{/login}">立即登录</a></p>
</div>
</body>
</html>
