<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 学生选课系统</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h1>学生登录</h1>
    <div th:if="${param.registered}" class="alert alert-success">注册成功，请使用学号和默认密码登录。</div>
    <div th:if="${param.error}" class="alert alert-error">账号或密码错误。</div>
    <div th:if="${param.logout}" class="alert alert-success">您已安全退出。</div>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>学号/账号
            <input type="text" name="username" th:value="${studentNumber}">
        </label>
        <label>密码
            <input type="password" name="password">
        </label>
        <button type="submit">登录</button>
    </form>
    <p>还没有账号？<a th:href="@{/register}">立即注册</a></p>
</div>
</body>
</html>
