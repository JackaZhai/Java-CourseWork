<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h1>修改密码</h1>
    <div th:if="${mustChange}" class="alert alert-error">首次登录必须修改密码后才能继续操作。</div>
    <form th:action="@{/student/change-password}" th:object="${passwordForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>旧密码
            <input type="password" th:field="*{oldPassword}">
            <span th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></span>
        </label>
        <label>新密码
            <input type="password" th:field="*{newPassword}">
            <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
        </label>
        <button type="submit">确认修改</button>
    </form>
</div>
</body>
</html>
